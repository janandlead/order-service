# Logical application name used by Spring Boot.
spring.application.name=order-service

# HTTP port on which the order service accepts requests.
server.port=8081

# PostgreSQL JDBC URL: host, port, and database used to persist orders.
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
# Database login username.
spring.datasource.username=postgres
# Database login password for the configured local database.
spring.datasource.password=root

# Update the database schema at startup to match the JPA entity mappings.
spring.jpa.hibernate.ddl-auto=update
# Print SQL statements executed by Hibernate.
spring.jpa.show-sql=true
# Format Hibernate SQL output for readability.
spring.jpa.properties.hibernate.format_sql=true

# Base URL used by InventoryClient for inventory availability requests.
inventory.service.url=http://localhost:8082

# Inventory retry policy.
# Maximum total attempts, including the initial call (up to two retries).
resilience4j.retry.instances.inventory-service.max-attempts=3
# Fixed delay between retry attempts.
resilience4j.retry.instances.inventory-service.wait-duration=10s
# Keep the retry delay constant instead of increasing it after each failure.
resilience4j.retry.instances.inventory-service.enable-exponential-backoff=false
# Retry failures reported as inventory service unavailability.
resilience4j.retry.instances.inventory-service.retry-exceptions=com.javacodeex.order.exception.InventoryServiceUnavailableException
# Do not retry missing-product or insufficient-stock failures.
resilience4j.retry.instances.inventory-service.ignore-exceptions=com.javacodeex.order.exception.InsufficientStockException

# Inventory circuit-breaker policy.
# Calculate failure rates from a number of calls rather than a time interval.
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-type=COUNT_BASED
# Retain the outcomes of the most recent ten recorded calls in the window.
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-size=10
# Require at least five recorded calls before calculating the failure rate.
resilience4j.circuitbreaker.instances.inventory-service.minimum-number-of-calls=5
# Open the circuit when the failure rate reaches or exceeds 50 percent.
resilience4j.circuitbreaker.instances.inventory-service.failure-rate-threshold=50
# Keep the circuit open for ten seconds before a call can trigger a half-open probe.
resilience4j.circuitbreaker.instances.inventory-service.wait-duration-in-open-state=10s
# Allow one trial call in the half-open state to assess recovery.
resilience4j.circuitbreaker.instances.inventory-service.permitted-number-of-calls-in-half-open-state=1
# Count inventory service unavailability exceptions as circuit-breaker failures.
resilience4j.circuitbreaker.instances.inventory-service.record-exceptions=com.javacodeex.order.exception.InventoryServiceUnavailableException
# Exclude stock-related business failures from circuit-breaker outcome recording.
resilience4j.circuitbreaker.instances.inventory-service.ignore-exceptions=com.javacodeex.order.exception.InsufficientStockException
